<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="header__title">Todo List</h1>
        <p class="header__subtitle">오늘 할 일을 기록해보세요</p>
      </header>

      <!-- 주간 뷰 네비게이터 -->
      <div class="week-nav">
        <div class="week-nav__header">
          <div class="week-nav__header-left">
            <button class="week-nav__arrow" id="prevWeekButton" aria-label="이전 주">&#8249;</button>
            <button class="week-nav__label-btn" id="weekLabelButton">
              <span id="weekLabel"></span>
              <span class="week-nav__caret">▾</span>
            </button>
            <button class="week-nav__arrow" id="nextWeekButton" aria-label="다음 주">&#8250;</button>
          </div>
          <button class="week-nav__today-btn" id="todayButton">오늘</button>
        </div>
        <!-- 요일 / 날짜 셀 그리드 -->
        <div class="week-days" id="weekDays"></div>
        <!-- 주차 선택 드롭다운 -->
        <div class="week-picker hidden" id="weekPicker"></div>
      </div>

      <!-- 필터 탭 -->
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab is-active" data-filter="all">전체</button>
        <button class="filter-tab" data-filter="active">진행 중</button>
        <button class="filter-tab" data-filter="completed">완료</button>
      </div>

      <!-- Todo 입력 영역 -->
      <section class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="todoInput"
            class="todo-input"
            placeholder="할 일을 입력하세요..."
            maxlength="100"
          />
          <button id="addButton" class="btn btn--primary">추가</button>
        </div>
        <!-- 빈 입력값 안내 메시지 (기본: 숨김) -->
        <p id="errorMessage" class="error-message hidden">
          할 일을 입력해주세요.
        </p>
      </section>

      <!-- Todo 목록 영역 -->
      <section class="list-section">
        <ul id="todoList" class="todo-list"></ul>
        <!-- Todo가 없을 때 표시되는 빈 상태 메시지 -->
        <div id="emptyState" class="empty-state">
          <span class="empty-state__icon">📋</span>
          <p class="empty-state__text">등록된 할 일이 없습니다.</p>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
