<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="header__title">Todo List</h1>
        <p class="header__subtitle">오늘 할 일을 기록해보세요</p>
      </header>

      <!-- 날짜 네비게이터 -->
      <div class="date-nav">
        <button class="date-nav__arrow" id="prevDateButton" aria-label="이전 날짜">&#8249;</button>
        <span class="date-nav__label" id="dateLabel"></span>
        <button class="date-nav__arrow" id="nextDateButton" aria-label="다음 날짜">&#8250;</button>
      </div>

      <!-- 필터 탭 -->
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab is-active" data-filter="all">전체</button>
        <button class="filter-tab" data-filter="active">진행 중</button>
        <button class="filter-tab" data-filter="completed">완료</button>
      </div>

      <!-- Todo 입력 영역 -->
      <section class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="todoInput"
            class="todo-input"
            placeholder="할 일을 입력하세요..."
            maxlength="100"
          />
          <button id="addButton" class="btn btn--primary">추가</button>
        </div>
        <!-- 빈 입력값 안내 메시지 (기본: 숨김) -->
        <p id="errorMessage" class="error-message hidden">
          할 일을 입력해주세요.
        </p>
      </section>

      <!-- Todo 목록 영역 -->
      <section class="list-section">
        <ul id="todoList" class="todo-list"></ul>
        <!-- Todo가 없을 때 표시되는 빈 상태 메시지 -->
        <div id="emptyState" class="empty-state">
          <span class="empty-state__icon">📋</span>
          <p class="empty-state__text">등록된 할 일이 없습니다.</p>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
